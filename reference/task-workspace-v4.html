<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Task workspace – v3</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --bg: #eef1f7;
        --pn: #fff;
        --ink: #131a2b;
        --mut: #6b7488;
        --ln: #e3e7ef;
        --soft: #f5f7fb;
        --acc: #3454f5;
        --accs: #e9edff;
        --pl: #8a94a8;
        --ip: #f59e0b;
        --bl: #ef4444;
        --dn: #16a34a;
        --sh:
          0 1px 2px rgba(19, 26, 43, 0.06),
          0 8px 24px -12px rgba(19, 26, 43, 0.18);
        --h: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0f17;
          --pn: #151a26;
          --ink: #eef1f8;
          --mut: #8e98ae;
          --ln: #252c3d;
          --soft: #1b2130;
          --acc: #8199ff;
          --accs: #222c52;
          --sh:
            0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0f17;
        --pn: #151a26;
        --ink: #eef1f8;
        --mut: #8e98ae;
        --ln: #252c3d;
        --soft: #1b2130;
        --acc: #8199ff;
        --accs: #222c52;
        --sh: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 "Instrument Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        cursor: pointer;
        text-align: left;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        height: 100%;
        transition: grid-template-columns 0.25s;
      }
      .shell.nosb {
        grid-template-columns: 0 1fr;
      }
      .shell.nosb .side {
        opacity: 0;
        pointer-events: none;
      }
      .side {
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
        transition: opacity 0.2s;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 700 17px var(--h);
        padding: 4px 8px 16px;
      }
      .brand b {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--acc);
        color: var(--pn);
        display: grid;
        place-items: center;
        font-size: 15px;
      }
      .nv {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 10px;
        color: var(--mut);
        font-weight: 500;
        width: 100%;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nv:hover {
        background: var(--pn);
        color: var(--ink);
      }
      .nv.on {
        background: var(--pn);
        color: var(--ink);
        box-shadow: var(--sh);
      }
      .nv span {
        flex: 1;
      }
      .nv i {
        font-style: normal;
        font-size: 11px;
        color: var(--mut);
      }
      .sub2 {
        margin: 2px 0 6px 18px;
        padding-left: 10px;
        border-left: 1px solid var(--ln);
        display: grid;
        gap: 1px;
      }
      .sub2 .nv {
        padding: 6px 10px;
        font-size: 13px;
      }
      .gap {
        flex: 1;
      }
      .proj {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        background: var(--pn);
        box-shadow: var(--sh);
      }
      .proj small {
        display: block;
        color: var(--mut);
        font-size: 11px;
      }
      .panel {
        margin: 10px 10px 10px 0;
        background: var(--pn);
        border-radius: 22px;
        box-shadow: var(--sh);
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        position: relative;
      }
      .nosb .panel {
        margin-left: 10px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 24px;
        flex: none;
      }
      .ib {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--mut);
      }
      .ib:hover {
        background: var(--soft);
        color: var(--ink);
      }
      .sbtn {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--soft);
        border-radius: 10px;
        padding: 7px 12px;
        color: var(--mut);
        min-width: 200px;
      }
      .sbtn kbd {
        margin-left: auto;
        font: 11px var(--h);
        border: 1px solid var(--ln);
        border-radius: 6px;
        padding: 1px 6px;
      }
      .cta {
        background: var(--acc);
        color: var(--pn);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .cta:hover {
        filter: brightness(1.08);
      }
      .body {
        flex: 1;
        overflow: auto;
        padding: 4px 28px 32px;
      }
      h1 {
        font: 700 32px/1.1 var(--h);
        letter-spacing: -0.02em;
        margin: 0;
      }
      .sub {
        color: var(--mut);
        margin: 4px 0 0;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 20px;
      }
      .seg {
        display: flex;
        background: var(--soft);
        border-radius: 11px;
        padding: 3px;
      }
      .seg button {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 12px;
        border-radius: 8px;
        color: var(--mut);
        font-weight: 500;
      }
      .seg .on {
        background: var(--pn);
        color: var(--ink);
        box-shadow: var(--sh);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .chip {
        padding: 5px 12px;
        border-radius: 99px;
        border: 1px solid var(--ln);
        color: var(--mut);
        font-weight: 500;
      }
      .chip.on {
        background: var(--ink);
        color: var(--pn);
        border-color: var(--ink);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }
      .stat {
        border-radius: 16px;
        background: var(--soft);
        padding: 16px;
      }
      .stat p {
        margin: 0;
        color: var(--mut);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .stat strong {
        font: 700 38px/1 var(--h);
        display: block;
        margin-top: 14px;
        letter-spacing: -0.03em;
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
        gap: 16px;
        margin-top: 16px;
      }
      .box {
        border: 1px solid var(--ln);
        border-radius: 16px;
        padding: 18px;
      }
      .box h2 {
        font: 700 16px var(--h);
        margin: 0 0 2px;
      }
      .chart {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
        height: 180px;
        align-items: end;
        margin-top: 14px;
      }
      .chart div {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        color: var(--mut);
        font-size: 12px;
        gap: 6px;
      }
      .chart s {
        display: block;
        width: 100%;
        max-width: 44px;
        border-radius: 10px;
        background: var(--accs);
        transform-origin: bottom;
        animation: grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .chart .hot s {
        background: var(--acc);
      }
      .chart em {
        font-style: normal;
        font-weight: 600;
        color: var(--ink);
      }
      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--ln);
        width: 100%;
      }
      .row:first-child {
        border-top: 0;
      }
      .row .t {
        flex: 1;
        min-width: 0;
      }
      .row .t b {
        display: block;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row small {
        color: var(--mut);
      }
      .ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 700 11px var(--h);
        background: conic-gradient(
          var(--acc) calc(var(--p) * 1%),
          var(--soft) 0
        );
      }
      .ring::before {
        content: "";
        position: absolute;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--pn);
      }
      .ring span {
        position: relative;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(220px, 1fr));
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .col {
        background: var(--soft);
        border-radius: 16px;
        padding: 10px;
        min-height: 340px;
        border: 2px solid transparent;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .col.over {
        border-color: var(--acc);
        background: var(--accs);
      }
      .col h3 {
        margin: 2px 4px 10px;
        font: 700 14px var(--h);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .col h3 i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .col h3 em {
        font-style: normal;
        margin-left: auto;
        color: var(--mut);
        font: 500 12px "Instrument Sans";
      }
      .card {
        background: var(--pn);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px;
        box-shadow: var(--sh);
        cursor: grab;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .card:hover {
        transform: translateY(-2px);
      }
      .card.drag {
        opacity: 0.35;
        transform: rotate(2deg);
      }
      .ct {
        font-weight: 500;
        margin-bottom: 10px;
      }
      .cm {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--mut);
        font-size: 12px;
      }
      .tag {
        background: var(--accs);
        color: var(--acc);
        padding: 1px 8px;
        border-radius: 99px;
        font-weight: 600;
      }
      .due {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .due svg {
        width: 12px;
        height: 12px;
      }
      .late {
        color: var(--bl);
      }
      .av {
        margin-left: auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--pn);
        display: grid;
        place-items: center;
        font-size: 10px;
      }
      .pri {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .p-h {
        background: var(--bl);
      }
      .p-m {
        background: var(--ip);
      }
      .p-l {
        background: var(--pl);
      }
      .bar {
        height: 4px;
        border-radius: 4px;
        background: var(--soft);
        margin-top: 10px;
        overflow: hidden;
      }
      .bar b {
        display: block;
        height: 100%;
        background: var(--dn);
      }
      .lrow {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        width: 100%;
      }
      .lrow:hover {
        background: var(--soft);
      }
      .lrow .t {
        flex: 1;
        font-weight: 500;
      }
      .pill {
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .pill i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .cal .dh {
        color: var(--mut);
        font-size: 12px;
        padding: 2px 6px;
      }
      .day {
        min-height: 96px;
        border-radius: 12px;
        background: var(--soft);
        padding: 6px;
        border: 2px solid transparent;
      }
      .day.over {
        border-color: var(--acc);
        background: var(--accs);
      }
      .day > b {
        font: 600 12px var(--h);
        color: var(--mut);
      }
      .mini {
        background: var(--pn);
        border-radius: 8px;
        padding: 4px 8px;
        margin-top: 4px;
        font-size: 12px;
        font-weight: 500;
        cursor: grab;
        box-shadow: var(--sh);
        border-left: 3px solid var(--acc);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: block;
        width: 100%;
      }
      .tray {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px;
        border: 2px dashed var(--ln);
        border-radius: 14px;
        margin-bottom: 14px;
        align-items: center;
        min-height: 52px;
      }
      .tray.over {
        border-color: var(--acc);
      }
      .tray small {
        color: var(--mut);
      }
      .tray .mini {
        width: auto;
        margin: 0;
      }
      .dr {
        position: absolute;
        inset: 0 0 0 auto;
        width: min(400px, 100%);
        background: var(--pn);
        box-shadow: -20px 0 50px -20px rgba(0, 0, 0, 0.35);
        transform: translateX(105%);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        padding: 22px;
        overflow: auto;
        z-index: 5;
      }
      .dr.on {
        transform: none;
      }
      .dr h2 {
        font: 700 22px/1.2 var(--h);
        margin: 6px 0 16px;
      }
      .fld {
        margin: 16px 0 6px;
        color: var(--mut);
        font-size: 12px;
        font-weight: 600;
      }
      .dr .seg {
        flex-wrap: wrap;
      }
      .dr input[type="date"] {
        background: var(--soft);
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
      }
      .ck {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--ln);
        width: 100%;
      }
      .ck b {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        border: 2px solid var(--ln);
        display: grid;
        place-items: center;
        color: var(--pn);
      }
      .ck.d b {
        background: var(--dn);
        border-color: var(--dn);
      }
      .ck.d span {
        text-decoration: line-through;
        color: var(--mut);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 14, 24, 0.45);
        backdrop-filter: blur(3px);
        display: none;
        z-index: 20;
        padding: 12vh 16px;
      }
      .ov.on {
        display: block;
      }
      .mdl {
        max-width: 520px;
        margin: auto;
        background: var(--pn);
        border-radius: 18px;
        padding: 12px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
      }
      .mdl input,
      .mdl select {
        width: 100%;
        background: var(--soft);
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        margin: 0 0 8px;
        outline: 0;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 120px);
        background: var(--ink);
        color: var(--pn);
        padding: 10px 12px 10px 16px;
        border-radius: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        transition: transform 0.3s;
        z-index: 30;
      }
      .toast.on {
        transform: translate(-50%, 0);
      }
      .toast button {
        color: var(--pn);
        font-weight: 700;
        text-decoration: underline;
      }
      .mob {
        display: none;
      }
      @media (max-width: 820px) {
        .shell,
        .shell.nosb {
          grid-template-columns: 1fr;
        }
        .side {
          display: none;
        }
        .panel,
        .nosb .panel {
          margin: 0;
          border-radius: 0;
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
        .sbtn {
          min-width: 0;
        }
        .sbtn kbd,
        .sbtn span {
          display: none;
        }
        .body {
          padding: 4px 16px 90px;
        }
        .mob {
          display: flex;
          position: fixed;
          inset: auto 0 0;
          background: var(--pn);
          border-top: 1px solid var(--ln);
          justify-content: space-around;
          padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
          z-index: 10;
        }
        .mob .nv {
          width: auto;
          flex-direction: column;
          font-size: 11px;
          gap: 2px;
        }
        .mob .nv span {
          flex: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      .dr {
        width: min(460px, 100%);
      }
      .dr #ed {
        min-height: 200px;
      }
      .btn2 {
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 6px 12px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-weight: 500;
        color: var(--ink);
      }
      .btn2:hover {
        background: var(--soft);
      }
      .btn2.pr {
        background: var(--acc);
        color: var(--pn);
        border-color: var(--acc);
      }
      .btn2:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .shd {
        font-size: 11px;
        font-weight: 600;
        color: var(--mut);
        padding: 14px 10px 4px;
      }
      .proj {
        width: 100%;
      }
      .pj {
        position: relative;
      }
      .pop {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 14px;
        box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.4);
        padding: 8px;
        z-index: 8;
      }
      .pop .nv {
        padding: 7px 8px;
        font-size: 13px;
      }
      .pop input,
      .srch {
        width: 100%;
        background: var(--soft);
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        outline: 0;
      }
      .srch {
        padding: 11px 14px;
        margin-bottom: 14px;
      }
      .dh2 {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .dh2 .gap {
        flex: 1;
      }
      .dc {
        display: flex;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--ln);
        border-radius: 14px;
        width: 100%;
        margin-bottom: 10px;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .dc:hover {
        border-color: var(--acc);
        transform: translateY(-1px);
      }
      .dc > svg {
        width: 20px;
        height: 20px;
        color: var(--acc);
        margin-top: 3px;
      }
      .dc b {
        font: 700 16px var(--h);
        display: block;
      }
      .dc p {
        margin: 4px 0 8px;
        color: var(--mut);
      }
      .dc small {
        color: var(--mut);
      }
      .dwrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 36px;
      }
      .dwrap.one {
        grid-template-columns: 1fr;
      }
      .edwrap {
        display: grid;
        gap: 20px;
      }
      .edwrap.split {
        grid-template-columns: 1fr 1fr;
      }
      .tb {

        refresh: () => {

        pstyle: (v) => {

        },
        pt: (v) => {
          const a = S.ps.t;

        },
        pd: (v) => {
          const a = S.ps.d;
          a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v);
        },
        copy: () => {
          navigator.clipboard?.writeText(promptText()).then(

          );

      };
      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("ov")) {
          e.target.classList.remove("on");
          return;
        }
        if (S.pjOpen && !e.target.closest(".pj")) {
          S.pjOpen = 0;

        const a = e.target.closest("[data-a]");

          return;
        if (!ACT[a.dataset.a]?.(a.dataset.v, a)) render();
      });
      document.addEventListener("change", (e) => {
        const a = e.target.closest("[data-a]");
        if (e.target.matches("[data-due]")) {
          setDue(S.open, e.target.value);
          render();
        } else if (a && (a.tagName === "SELECT" || a.type === "checkbox")) {
          ACT[a.dataset.a](a.dataset.v, a);
          render();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "ed") onEd();
        if (e.target.id === "dq") {
          S.dq = e.target.value;
          $("#dl").innerHTML = docCards();
        }
      });
      $("#pq").addEventListener("input", (e) => (pr = palList(e.target.value)));
      $("#pq").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && pr[0]) {
          pr[0].f();
          $("#pal").classList.remove("on");
          render();
        }
      });
      $("#nt").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          ACT.create() || render();
        }
      });
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase(),
          mod = e.metaKey || e.ctrlKey;
        if (mod && k === "k") {
          e.preventDefault();
          openPal();
        }
        if (mod && k === "b") {
          e.preventDefault();
          sbToggle();
          render();
        }
        if (mod && k === "s" && S.ed) {
          e.preventDefault();
          ACT[S.ed.k === "doc" ? "save" : "tsave"]();
          render();
        }
        if (e.key === "Escape") {
          document
            .querySelectorAll(".ov")
            .forEach((o) => o.classList.remove("on"));
          S.pjOpen = 0;
          if (S.open) ACT.close();
          render();
        }
      });
      let dragId = null;
      document.addEventListener("dragstart", (e) => {
        const c = e.target.closest("[data-tid]");
        if (!c) return;
        dragId = c.dataset.tid;
        e.dataTransfer.setData("text/plain", dragId);
        e.dataTransfer.effectAllowed = "move";
        setTimeout(() => c.classList.add("drag"), 0);
      });
      document.addEventListener("dragend", () => {
        dragId = null;
        document
          .querySelectorAll(".drag,.over")
          .forEach((x) => x.classList.remove("drag", "over"));
      });
      document.addEventListener("dragover", (e) => {
        const z = e.target.closest("[data-drop],[data-dropday]");
        document
          .querySelectorAll(".over")
          .forEach((x) => x !== z && x.classList.remove("over"));
        if (z && dragId) {
          e.preventDefault();
          z.classList.add("over");
        }
      });
      document.addEventListener("drop", (e) => {
        const z = e.target.closest("[data-drop],[data-dropday]");
        if (!z || !dragId) return;
        e.preventDefault();
        const id = dragId;
        dragId = null;
        if ("drop" in z.dataset) setStatus(id, z.dataset.drop);
        else setDue(id, z.dataset.dropday);
        render();
      });
      
const NC={Overview:"var(--acc)",Tasks:"var(--acc)",Calendar:"var(--acc)",Groups:"var(--acc)",Documents:"var(--acc)",Prompts:"var(--acc)"};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const shift=(k,n)=>{const d=new Date(k+"T12:00");d.setDate(d.getDate()+n);return ymd(d)};
Object.assign(S,{sbm:"full",sw:240,last:"full",cv:"Month",cd:TODAY,lv:0,nd:null,ext:[],flash:null});
try{const x=JSON.parse(localStorage.getItem("tsb"));if(x){[S.sbm,S.sw,S.last]=x}}catch(e){}
function sbToggle(){if(S.sbm==="hidden")S.sbm=S.last||"full";else{S.last=S.sbm;S.sbm="hidden"}}
function qa(s){let due=S.nd,g=null;S.nd=null;
 s=s.replace(/#(\w+)/,(m,w)=>{const x=G.find(y=>y.toLowerCase().replace(/\s/g,"").startsWith(w.toLowerCase()));if(x)g=x;return x?"":m});
 s=s.replace(/\b(today|tomorrow|(?:mon|tue|wed|thu|fri|sat|sun)(?:day|sday|nesday|rsday|urday)?)\b/i,(m,w)=>{w=w.toLowerCase();if(w==="today")due=TODAY;else if(w==="tomorrow")due=shift(TODAY,1);else{const i=DAYS.map(x=>x.toLowerCase()).indexOf(w.slice(0,3)),c=(new Date(TODAY+"T12:00").getDay()+6)%7;due=shift(TODAY,(i-c+7)%7||7)}return""});
 return{n:s.replace(/\s+/g," ").trim(),due,g}}
const SIM=[["TASK-17","in-progress","CLI"],["TASK-19","blocked","Editor"],["TASK-20","in-progress","CLI"]];let si=0;
function sim(){for(let k=0;k<3;k++){const[id,s,src]=SIM[si++%3],t=T.find(x=>x.id===id);if(t&&t.s!==s){t.s=s;S.flash=id;S.ext.unshift({id,s,src,at:Date.now()});log("task",id+" changed by "+src);toast(src+" changed "+id+" to "+stOf(s)[1]);render();setTimeout(()=>{S.flash=null},2200);return}}}
const pill=t=>{const[,l,c]=stOf(t.s);return`<span class="pill" style="background:color-mix(in srgb,${c} 16%,transparent)"><i style="background:${c}"></i>${l}</span>`};
const mini=t=>`<span class="mini s-${t.s}" draggable="true" data-tid="${t.id}" data-a="open" data-v="${t.id}" title="${t.n}">${t.n}</span>`;
function overview(){
 const A=T.filter(t=>!t.arch),O=A.filter(t=>t.s!=="completed"),late=O.filter(t=>t.due&&t.due<TODAY),
 foc=[...new Set([...O.filter(t=>t.s==="blocked"),...O.filter(t=>t.due&&t.due<=TODAY),...O.filter(t=>t.s==="in-progress")])].slice(0,6),
 hr=new Date().getHours(),hi=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening",done=C[5],tot=C.reduce((a,b)=>a+b,0),
 p=done+foc.length?Math.round(done/(done+foc.length)*100):100,mx=Math.max(...C,1),
 wk=Array.from({length:7},(_,i)=>shift(TODAY,i)),n=s=>A.filter(t=>t.s===s).length,
 rc=A.filter(t=>t.s==="completed"&&!t.hide).sort((a,b)=>b.at-a.at).slice(0,4);
 let off=0;const seg=ST.map(([k,,c])=>{const f=n(k)/(A.length||1)*251.3,s=`<circle class="dseg" cx="50" cy="50" r="40" fill="none" stroke="${c}" stroke-width="12" stroke-dasharray="${f} ${251.3-f}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=f;return s}).join("");
 const hd=(i,t,x="")=>`<div class="sh2"><i class="hi">${ic(i)}</i><h2>${t}</h2>${x}</div>`;
 const stat=(i,l,v,c)=>`<div class="stat2" style="--c:${c}"><span class="ti">${ic(i)}</span><div><strong data-n="${v}">0</strong><small>${l}</small></div></div>`;
 return`<div class="hero2"><div class="hz"><p>Saturday, Oct 31 · ${PJ[S.pj].n}</p><h1>${hi}</h1><p class="hs">${foc.length?`${foc.length} to focus on${late.length?`, ${late.length} overdue`:""}. ${done} finished today.`:"All clear. Nothing needs you right now."}</p><div class="hc"><span>${ic("fl")}${n("blocked")} blocked</span><span>${ic("cl")}${n("in-progress")} in progress</span><span>${ic("ca")}${O.filter(t=>t.due).length} scheduled</span></div></div><div class="hr"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/><circle class="rg" cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${p/100*276.5} 276.5" transform="rotate(-90 50 50)"/></svg><div><b>${p}%</b><small>today</small></div></div></div>
<div class="st4">${stat("ck","Done this week",tot,"#16a34a")}${stat("cl","In progress",n("in-progress"),"#f59e0b")}${stat("ca","Scheduled",O.filter(t=>t.due).length,"#3454f5")}${stat("al","Blocked",n("blocked"),"#ef4444")}</div>
<div class="ovg"><div class="stk"><div class="box">${hd("tg","Focus now")}${foc.map(t=>`<div class="tr" data-fid="${t.id}"><button class="chk" data-a="done" data-v="${t.id}" aria-label="Mark ${t.id} done">${ic("ck")}</button><button class="t" data-a="open" data-v="${t.id}"><b>${t.n}</b><small>${t.id} · ${t.g}${t.due?" · "+fmt(t.due):""}</small></button>${pill(t)}</div>`).join("")||'<p class="sub">Nothing open. Enjoy the quiet.</p>'}</div>
<div class="box">${hd("ca","Next 7 days",`<button class="btn2" data-a="cal" data-v="${TODAY}">Open calendar</button>`)}<div class="wk7">${wk.map((k,i)=>{const d=new Date(k+"T12:00"),c=A.filter(t=>t.due===k&&t.s!=="completed").length;return`<button class="wd ${i?"":"tdy"}" data-dropday="${k}" data-a="cal" data-v="${k}" title="${c} due"><small>${DAYS[(d.getDay()+6)%7]}</small><b>${d.getDate()}</b><s>${"<i></i>".repeat(Math.min(c,4))}</s></button>`}).join("")}</div><p class="sub" style="margin:10px 4px 0">Drop a task on a day to schedule it.</p></div>
<div class="box">${hd("ck","Recently finished")}${rc.map(t=>`<div class="tr dn"><span class="chk d">${ic("ck")}</span><button class="t" data-a="open" data-v="${t.id}"><b>${t.n}</b><small>${t.id} · ${ago(t.at)}</small></button></div>`).join("")||'<p class="sub">Nothing yet.</p>'}</div></div>
<div class="stk"><div class="box">${hd("tr","Finished this week")}<div class="chart" role="img" aria-label="Completions per day: ${C.join(", ")}">${C.map((c,i)=>`<div class="${i===5?"hot":""}"><em>${c}</em><s style="height:${Math.max(6,c/mx*110)}px"></s>${DAYS[i]}</div>`).join("")}</div></div>
<div class="box">${hd("ly","Where things stand")}<div class="dn2"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--soft)" stroke-width="12"/>${seg}</svg><div class="dc2"><b>${A.length}</b><small>tasks</small></div><div class="lg">${ST.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}<b>${n(k)}</b></span>`).join("")}</div></div></div>
<div class="box">${hd("gr","Groups")}${G.map((g,gi)=>{const a=A.filter(t=>t.g===g),q=a.length?Math.round(a.filter(t=>t.s==="completed").length/a.length*100):0;return`<button class="gp" data-a="grpgo" data-v="${g}" style="--c:${["#3454f5","#8b5cf6","#10b981"][gi%3]}"><span class="gt"><b>${g}</b><small>${a.length} tasks · ${q}%</small></span><span class="gb"><i style="width:${q}%"></i></span></button>`}).join("")}</div></div></div>`}
function calView(){
 const base=new Date(S.cd+"T12:00"),wk=S.cv==="Week",A=T.filter(t=>!t.arch&&(!S.grp||t.g===S.grp));
 let st,len;
 if(wk){st=new Date(base);st.setDate(base.getDate()-(base.getDay()+6)%7);len=7}
 else{const f=new Date(base.getFullYear(),base.getMonth(),1),o=(f.getDay()+6)%7;st=new Date(f);st.setDate(1-o);len=Math.ceil((o+new Date(base.getFullYear(),base.getMonth()+1,0).getDate())/7)*7}
 const cells=Array.from({length:len},(_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const k=ymd(d),L=A.filter(t=>t.due===k),mx=wk?9:3;
  return`<div class="day ${wk?"wk":""} ${k===TODAY?"tdy":""} ${!wk&&d.getMonth()!==base.getMonth()?"oth":""}" data-dropday="${k}"><div class="xd"><b>${d.getDate()}</b><button class="add" data-a="addday" data-v="${k}" aria-label="Add task on ${fmt(k)}">${ic("pl")}</button></div>${L.slice(0,mx).map(mini).join("")}${L.length>mx?`<span class="more">+${L.length-mx} more</span>`:""}</div>`}).join("");
 const un=A.filter(t=>!t.due&&t.s!=="completed"),title=wk?`${fmt(ymd(st))} – ${fmt(shift(ymd(st),6))}`:base.toLocaleDateString("en",{month:"long",year:"numeric"});
 return`<div class="calh"><h1>${title}</h1><button class="ib" data-a="cnav" data-v="-1" aria-label="Previous">${ic("bk")}</button><button class="btn2" data-a="cnav" data-v="0">Today</button><button class="ib nx" data-a="cnav" data-v="1" aria-label="Next">${ic("bk")}</button><span class="gap"></span><div class="seg">${["Month","Week"].map(v=>`<button class="${S.cv===v?"on":""}" data-a="cview" data-v="${v}">${v}</button>`).join("")}</div></div>
<div class="calw"><div class="cal">${DAYS.map(d=>`<div class="dh">${d}</div>`).join("")}${cells}</div><aside class="unp" data-dropday=""><h2>Unscheduled</h2><p class="sub" style="margin:2px 0 8px">Drag onto a day, or drop here to clear a date.</p>${un.map(mini).join("")||'<p class="sub">Everything has a date.</p>'}</aside></div>`}
function post(){const sh=$("#sh"),m=S.sbm;sh.classList.toggle("msb",m==="mini");sh.classList.toggle("hid",m==="hidden");
 sh.style.setProperty("--sw",(m==="hidden"?0:m==="mini"?68:S.sw)+"px");
 const b=$("[data-side]");b.title=m==="hidden"?"Show sidebar (Ctrl/Cmd+B)":"Hide sidebar (Ctrl/Cmd+B)";b.setAttribute("aria-label",b.title);b.classList.toggle("on",m==="hidden");
 const rz=$("#rz");rz.setAttribute("aria-valuenow",m==="mini"?68:S.sw);
 $("#lvp").classList.toggle("on",!!S.lv);
 $("#lvp").innerHTML=`<b>Live sync</b><p class="sub">Watching ${PJ[S.pj].p}. Edits from your editor or the CLI show up here as they happen.</p><code class="cli">task move TASK-17 in-progress</code>${S.ext.slice(0,3).map(e=>`<p><span class="src ${e.src}">${e.src}</span> ${e.id} to ${stOf(e.s)[1]} <small class="sub">${ago(e.at)}</small></p>`).join("")}<button class="btn2" data-a="sim">Try a CLI change</button>`;
 if(S.flash)document.querySelectorAll(`[data-tid="${S.flash}"],[data-fid="${S.flash}"]`).forEach(e=>e.classList.add("flash"));
 try{localStorage.setItem("tsb",JSON.stringify([S.sbm,S.sw,S.last]))}catch(e){}}
let lk="";
function enter(){const k=S.sec+S.cv+S.view+(S.doc||"");if(k===lk)return;lk=k;const m=$("#main");m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter");m.querySelectorAll(".box,.stat2,.hero2,.unp,.wk7,.day,.col").forEach((e,i)=>e.style.setProperty("--i",Math.min(i,14)))}
function render(){render0();post();enter()}
(()=>{const sh=$("#sh"),rz=document.createElement("div");rz.id="rz";rz.className="rz";rz.tabIndex=0;rz.setAttribute("role","separator");rz.setAttribute("aria-orientation","vertical");rz.setAttribute("aria-label","Resize sidebar");sh.appendChild(rz);
 const live=()=>{$("#side").innerHTML=side();post()};
 rz.addEventListener("pointerdown",e=>{rz.setPointerCapture(e.pointerId);sh.classList.add("dg");
  rz.onpointermove=e=>{if(e.clientX<150)S.sbm="mini";else{S.sbm="full";S.sw=Math.min(400,Math.max(200,e.clientX))}live()};
  rz.onpointerup=()=>{sh.classList.remove("dg");rz.onpointermove=null}});
 rz.addEventListener("dblclick",()=>{S.sw=240;S.sbm="full";live()});
 rz.addEventListener("keydown",e=>{const d={ArrowLeft:-16,ArrowRight:16}[e.key];if(d){S.sw=Math.min(400,Math.max(200,S.sw+d));S.sbm="full";live()}if(e.key==="Home"){S.sbm="mini";live()}});
 setTimeout(sim,16000)})();
render();
