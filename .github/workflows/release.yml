name: CI and npm release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and CLI package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Flutter dependencies
        run: bun run mobile:pub:get

      - name: Run release checks
        run: bun run cli:publish:check

  publish:
    name: Publish taskcode to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Check whether this version is already published
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./source/apps/cli/package.json').version")"
          if npm view "taskcode@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} is already published; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${version} is not on npm; it will be published after validation."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish taskcode with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --workspace taskcode --access public
